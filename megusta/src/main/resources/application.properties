spring.application.name=megusta
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/megusta
spring.datasource.username=megusta_admin
spring.datasource.password=sptech
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

server.error.include-message=always
server.error.include-binding-errors=always

springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.display-request-duration=true
springdoc.api-docs.path=/v3/api-docs

school.sptech.megusta.security.secret=${JWT_SECRET:sptech}