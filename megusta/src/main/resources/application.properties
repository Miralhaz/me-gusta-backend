spring.application.name=megusta
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/megusta
spring.datasource.username=megusta_admin
spring.datasource.password=sptech
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# 3° vulnerabilidade: Em toda exceção devolvia a mensagem de erro original para o cliente e
# todos os erros de validação devolvem detalhes dos campos.
# Correção: Loga o erro real apenas para os desenvolvedores, e não para o cliente em si.
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.display-request-duration=true
springdoc.api-docs.path=/v3/api-docs

school.sptech.megusta.security.secret=${JWT_SECRET:sptech}

megusta.notificacao.whatsapp.destinatario=${TELEFONE_DESTINATARIO:+5511999999999}

logging.file.name=logs/megusta.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.level.root=INFO
logging.level.school.sptech.megusta=INFO

spring.jackson.serialization.write-dates-as-timestamps=false